; Один проект, два окружения: sender (джойстик) и receiver (светодиод).
; Прошивка:
;   pio run -e sender   -t upload --upload-port COM11
;   pio run -e receiver -t upload --upload-port COM10
; Монитор порта:
;   pio device monitor -p COM11

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

[env:sender]
build_src_filter = -<*> +<sender.cpp>

[env:receiver]
build_src_filter = -<*> +<receiver.cpp>